name: lint

on:
  push:
  pull_request:

jobs:
  check-skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter
        run: |
          set -euo pipefail
          for f in $(find . -name "SKILL.md" -not -path "./.git/*"); do
            echo "Checking $f"
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "::error file=$f::missing frontmatter opening ---"
              exit 1
            fi
            if ! grep -q '^name:' "$f"; then
              echo "::error file=$f::missing required field 'name'"
              exit 1
            fi
            if ! grep -q '^description:' "$f"; then
              echo "::error file=$f::missing required field 'description'"
              exit 1
            fi
          done
          echo "All SKILL.md files valid."

  test-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh smoke tests
        run: ./test/install.test.sh
